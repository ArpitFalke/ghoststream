<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>GHOSTSTREAM</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--line:#2a2a2a;--text:#f1f1f1;--dim:#9a9a9a;--faint:#5c5c5c;--live:#ff3b30}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:0}
.hidden{display:none!important}
#hdr{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(15,15,15,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:20}
.wm{font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:center;gap:8px}
.wm-dot{width:8px;height:8px;background:var(--live)}
.wm .thin{color:var(--dim);font-weight:400}
.hdr-r{display:flex;align-items:center;gap:12px}
.hdr-s{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--faint)}
.hdr-s.on{color:var(--text)}.hdr-s.er{color:var(--live)}
#netDot{width:7px;height:7px;border-radius:50%;background:#3a3a3a}
#netDot.on{background:#f1f1f1}#netDot.er{background:var(--live)}#netDot.pu{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.iconb{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--dim)}
.iconb:active{background:var(--surface2);color:var(--text)}
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0f0f0f;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;z-index:20}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.nv.on{color:var(--text)}.nv span{font-size:9.5px}
.fab{align-self:center;justify-self:center;width:52px;height:52px;border-radius:50%;background:#f1f1f1;color:#0f0f0f;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 14px rgba(0,0,0,.5)}
#view{max-width:760px;margin:0 auto;padding:76px 14px calc(84px + env(safe-area-inset-bottom))}
.sect{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.dim{color:var(--dim)}.fine{font-size:12px;color:var(--faint)}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.big{width:34px;height:34px;color:var(--faint)}
.btn{background:#f1f1f1;color:#0f0f0f;border-radius:8px;padding:13px 18px;font-weight:700;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid #3a3a3a;color:var(--text)}
.btn.sm{padding:8px 12px;font-size:12px;font-weight:600}
.btn:disabled{opacity:.4}
.mini{font-size:10px;letter-spacing:.12em;color:var(--dim);border:1px solid var(--line);padding:3px 7px;border-radius:4px;text-transform:uppercase}
.inp{width:100%;background:#101010;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:13px 14px;font-size:15px;outline:none}
.inp:focus{border-color:#4a4a4a}
.av{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1px solid #3a3a3a;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--dim);flex:none}
.av.big{width:40px;height:40px;font-size:16px}
.av.xl{width:56px;height:56px;font-size:22px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
/* home identity strip */
.idstrip{display:flex;align-items:center;gap:12px}
.idmain{flex:1;min-width:0}
.idname{font-size:16px;font-weight:700}
.iduid{font-size:12px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:8px}
.idbtns{display:flex;gap:8px}
.connect{margin-top:12px}
.cn-row{display:flex;gap:8px}
.cn-row .inp{flex:1;min-width:0}
.scan-btn{width:48px;height:48px;background:#101010;border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.scan-btn:active{background:var(--surface2);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px 14px}
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.th-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.chip{position:absolute;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 7px;border-radius:4px}
.chip.dur{right:8px;background:rgba(0,0,0,.78);color:#fff}
.chip.live{left:8px;color:var(--live);border:1px solid rgba(255,59,48,.5);background:rgba(15,15,15,.8);display:flex;align-items:center;gap:5px}
.chip.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
.chip.live.off{color:var(--faint);border-color:#3a3a3a}
.chip.live.off::before{background:var(--faint);animation:none}
.c-body{padding:9px 2px 0}
.c-title{font-size:14.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--dim)}
.card-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:6px;background:rgba(0,0,0,.7);color:#ddd;display:flex;align-items:center;justify-content:center}
.card-x .i{width:16px;height:16px}
.empty{text-align:center;padding:50px 20px;color:var(--dim)}
.empty .i{margin:0 auto 14px;display:block}
.empty b{display:block;color:var(--text);margin-bottom:5px;font-size:15px}
.empty p{font-size:13px;max-width:280px;margin:0 auto}
.watch{margin:-16px -14px 0}
.vwrap{aspect-ratio:16/9;background:#000;max-height:56vh}
.vwrap video{width:100%;height:100%;display:block;background:#000}
.w-pad{padding:16px 16px 8px}
.w-title{font-size:17px;font-weight:700;line-height:1.35}
.w-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.chan{display:flex;align-items:center;gap:10px;cursor:pointer}
.chan .cn{font-size:13.5px;font-weight:600}
.w-note{margin-top:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.w-xfer{margin-top:6px;font-size:12px;color:var(--dim)}
.w-state{margin-top:8px;font-size:13px;color:var(--dim);min-height:18px}
.pbar{width:100%;height:5px;background:#101010;border-radius:3px;overflow:hidden;margin-top:10px}
.pbar div{height:100%;background:#f1f1f1;width:0%;transition:width .2s}
.woff{margin-top:16px;border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--surface)}
.woff p{font-size:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row-b{flex:1;min-width:0;font-size:13.5px;color:var(--dim)}
.row-b b{color:var(--text);font-weight:600}
.row-b .dim{font-size:11.5px;margin-top:2px}
.pdot{width:7px;height:7px;border-radius:50%;background:#3a3a3a;flex:none}
.pdot.on{background:#f1f1f1}
.onb{display:none;min-height:100vh;padding:80px 28px 40px;max-width:420px;margin:0 auto}
.onb .wm{font-size:20px;margin-bottom:8px}
.onb h1{font-size:22px;margin:26px 0 8px}
.onb p{color:var(--dim);font-size:14px;margin-bottom:28px}
.onb .fine{margin-top:18px;line-height:1.6}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom))}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.sh-code{font-size:26px;font-weight:800;letter-spacing:.22em;text-align:center;padding:14px;border:1px dashed #3a3a3a;border-radius:8px;margin-bottom:14px}
.qr-w{background:#f1f1f1;padding:6px;line-height:0;display:inline-block}
.qr-w canvas{display:block;width:180px;height:180px;image-rendering:pixelated}
#qrBox{display:flex;justify-content:center;margin:6px 0 16px}
.sh-note{font-size:12px;color:var(--faint);margin-top:12px;text-align:center;line-height:1.6}
.sh-btns{display:flex;gap:10px;margin-top:6px}
.sh-btns .btn{flex:1}
#toasts{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:#262626;border:1px solid #3a3a3a;color:var(--text);font-size:13px;padding:10px 16px;border-radius:8px;max-width:86%;opacity:0;transform:translateY(8px);transition:all .25s}
.toast.on{opacity:1;transform:none}
.scan-ov{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column}
.scan-ov.show{display:flex}
.scan-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.scan-t{font-size:11px;font-weight:800;letter-spacing:.2em}
.scan-area{flex:1;position:relative;overflow:hidden}
#gsReader{width:100%;height:100%}
#gsReader video{width:100%;height:100%;object-fit:cover}
.scan-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72%;max-width:300px;aspect-ratio:1/1;border:2px solid rgba(241,241,241,.15);box-shadow:0 0 0 9999px rgba(0,0,0,.65);pointer-events:none}
.scan-box::before,.scan-box::after{content:'';position:absolute;width:24px;height:24px;border-color:#f1f1f1;border-style:solid}
.scan-box::before{top:-2px;left:-2px;border-width:4px 0 0 4px}
.scan-box::after{bottom:-2px;right:-2px;border-width:0 4px 4px 0}
.scan-hint{position:absolute;bottom:12%;left:0;right:0;text-align:center;font-size:12px;color:#8a8a8a;letter-spacing:.08em}
@media(min-width:700px){#sheet{align-items:center}.sh{border-radius:14px}}
</style>
</head>
<body>
<header id="hdr">
  <div class="wm"><span class="wm-dot"></span>GHOST<span class="thin">STREAM</span></div>
  <div class="hdr-r">
    <span class="hdr-s" id="netTxt">OFFLINE</span>
    <span id="netDot"></span>
  </div>
</header>
<main id="view"></main>
<nav id="nav">
  <button class="nv" data-r="home"><svg class="i"><use href="#i-home"/></svg><span>Home</span></button>
  <button class="nv" data-r="subs"><svg class="i"><use href="#i-subs"/></svg><span>Subs</span></button>
  <button class="fab" data-r="publish"><svg class="i"><use href="#i-plus"/></svg></button>
  <button class="nv" data-r="activity"><svg class="i"><use href="#i-bell"/></svg><span>Activity</span></button>
  <button class="nv" data-r="you"><svg class="i"><use href="#i-person"/></svg><span>You</span></button>
</nav>
<div id="sheet" class="hidden"></div>
<div id="toasts"></div>
<input type="file" id="fpick" accept="video/*" class="hidden">
<div class="scan-ov" id="scanOv">
  <div class="scan-hdr">
    <span class="scan-t">SCAN CODE</span>
    <button class="iconb" data-act="scan-close" style="color:var(--text)"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="scan-area"><div id="gsReader"></div><div class="scan-box"></div><div class="scan-hint">Point at a GhostStream code</div></div>
</div>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></symbol>
  <symbol id="i-subs" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="11" rx="2"/><path d="M10 13.5v4l4-2z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 16H6c1.2-1.4 2-2.5 2-6a4 4 0 1 1 8 0c0 3.5.8 4.6 2 6z"/><path d="M10.5 19a1.5 1.5 0 0 0 3 0"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5H14zM20 14v.01M14 20v.01M17.5 17.5v.01M20 20v.01"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
  <symbol id="i-chevr" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
</svg>
<script>
/* ============ kill legacy service worker ============ */
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}
if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})}).catch(function(){})}

/* ============ utils ============ */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
function fmtB(n){n=+n||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function fmtT(s){s=+s||0;if(!isFinite(s)||s<=0)return'0:00';s=Math.round(s);var m=Math.floor(s/60),r=s%60,h=Math.floor(m/60);return h?h+':'+String(m%60).padStart(2,'0')+':'+String(r).padStart(2,'0'):m+':'+String(r).padStart(2,'0')}
function ago(ts){var d=Date.now()-ts;if(d<60e3)return'just now';if(d<3600e3)return Math.floor(d/60e3)+'m ago';if(d<86400e3)return Math.floor(d/3600e3)+'h ago';return new Date(ts).toLocaleDateString()}
function rid(n){var c='abcdefghjkmnpqrstuvwxyz23456789',s='';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function toast(msg,ms){ms=ms||3400;var t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);requestAnimationFrame(function(){t.classList.add('on')});setTimeout(function(){t.classList.remove('on');setTimeout(function(){t.remove()},300)},ms)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function playPing(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;playPing.ac=playPing.ac||new C();var ac=playPing.ac,o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.start();o.stop(ac.currentTime+.2)}catch(e){}}
var wakeLock=null;
async function reqWake(){try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null}}
function setHdr(state){var t=$('#netTxt'),d=$('#netDot');if(!t)return;d.className='';d.id='netDot';if(state==='on'){t.textContent='ONLINE';t.className='hdr-s on';d.classList.add('on')}else if(state==='er'){t.textContent='NETWORK DOWN';t.className='hdr-s er';d.classList.add('er')}else if(state==='re'){t.textContent='RECONNECTING';t.className='hdr-s';d.classList.add('pu')}else{t.textContent='OFFLINE';t.className='hdr-s'}}

/* ============ local stores ============ */
var idb={db:null,
open:function(){return new Promise(function(res){var r=indexedDB.open('ghoststream',1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('handles'))d.createObjectStore('handles')};r.onsuccess=function(){idb.db=r.result;res()};r.onerror=function(){res()}})},
get:function(k){return new Promise(function(res){try{var t=idb.db.transaction('handles','readonly'),q=t.objectStore('handles').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}}catch(e){res(null)}})},
put:function(k,v){return new Promise(function(res){try{var t=idb.db.transaction('handles','readwrite'),q=t.objectStore('handles').put(v,k);q.onsuccess=function(){res()};q.onerror=function(){res()}}catch(e){res()}})},
del:function(k){return new Promise(function(res){try{var t=idb.db.transaction('handles','readwrite');t.objectStore('handles').delete(k);res()}catch(e){res()}})}};
var me={uid:null,name:null};
function loadMe(){try{var m=JSON.parse(localStorage.getItem('gs-me')||'null');if(m&&m.uid){me.uid=m.uid;me.name=m.name||'Anonymous'}}catch(e){}}
function saveMe(){localStorage.setItem('gs-me',JSON.stringify(me))}
function getLocalNames(){try{return JSON.parse(localStorage.getItem('gs-names')||'{}')}catch(e){return{}}}
function savePeerName(id,name){if(!id||!name)return;var n=getLocalNames();n[id]=name;try{localStorage.setItem('gs-names',JSON.stringify(n))}catch(e){}}
function getRecents(){try{return JSON.parse(localStorage.getItem('gs-recents')||'[]')}catch(e){return[]}}
function addRecent(id){if(!id)return;var r=getRecents();r=r.filter(function(x){return x!==id});r.unshift(id);if(r.length>20)r=r.slice(0,20);localStorage.setItem('gs-recents',JSON.stringify(r))}

/* ============ video store: in-memory + localStorage pipe-synced + gun best-effort ============ */
var videos=new Map();
function loadFeed(){try{var f=JSON.parse(localStorage.getItem('gs-feed')||'{}');Object.keys(f).forEach(function(vid){if(!videos.has(vid))videos.set(vid,f[vid])})}catch(e){}}
function persistFeed(){try{var o={};videos.forEach(function(v,vid){o[vid]=v});localStorage.setItem('gs-feed',JSON.stringify(o))}catch(e){}}
function upsertVideo(vid,man,owner){
  if(!vid||!man)return;
  man.owner=owner||man.owner;
  if(!man.postedAt)man.postedAt=Date.now();
  videos.set(vid,man);persistFeed();renderCurrent();
}
function removeVideo(vid){videos.delete(vid);persistFeed();renderCurrent()}
function myManifestList(){var out=[];videos.forEach(function(v,vid){if(v.owner===me.uid)out.push({id:vid,man:v})});return out}

/* ============ friends (pipe-first, gun garnish) ============ */
var friends=new Map();
function addFriend(uid){if(!uid||uid===me.uid||friends.has(uid))return;friends.set(uid,Date.now());addRecent(uid);renderCurrent()}
var viewFn=null;
function renderCurrent(){if(viewFn)viewFn()}

/* ============ peer ============ */
var peer=null,conns=new Map();
function tryPeer(id){return new Promise(function(res,rej){
  var p=new Peer(id,{debug:0});var settled=false;
  p.on('open',function(){if(settled)return;settled=true;peer=p;
    p.on('connection',function(c){if(c.metadata&&c.metadata.ping){c.on('open',function(){try{c.close()}catch(e){}});return}wireConn(c)});
    p.on('disconnected',function(){setHdr('re');try{p.reconnect()}catch(e){}});
    p.on('error',function(err){
      if(err&&err.type==='peer-unavailable'){var m=/peer\s+(\S+)/.exec(err.message||'');if(m&&m[1]){pres[m[1]]={on:false,ts:Date.now()};failConn(m[1]);renderCurrent()}}
    });
    setHdr('on');res(true);
  });
  p.on('error',function(err){if(settled)return;settled=true;try{p.destroy()}catch(e){}rej(err)});
})}
async function bootPeer(){
  if(me.uid){try{if(await tryPeer(me.uid))return}catch(e){}}
  for(var i=0;i<8;i++){var cand='gs'+rid(8);try{if(await tryPeer(cand)){me.uid=cand;saveMe();return}}catch(e){}}
  toast('Network init failed — check connection, reload');
}
var pendingConn=new Map();
function failConn(uid){var p=pendingConn.get(uid);if(p){pendingConn.delete(uid);try{p(new Error('offline'))}catch(e){}}}
function getConn(uid){return new Promise(function(res,rej){
  if(uid===me.uid)return res(null);
  var c=conns.get(uid);
  if(c&&c.open)return res(c);
  var t=setTimeout(function(){failConn(uid);rej(new Error('timeout'))},8000);
  pendingConn.set(uid,function(err){clearTimeout(t);rej(err)});
  try{c=peer.connect(uid,{reliable:true});conns.set(uid,c);c.on('open',function(){clearTimeout(t);pendingConn.delete(uid);res(c)})}catch(e){clearTimeout(t);rej(e)}
})}

/* ============ directdrop presence probe (single source of truth) ============ */
var pres={};
try{pres=JSON.parse(localStorage.getItem('gs-pres')||'{}')}catch(e){pres={}}
function savePres(){try{localStorage.setItem('gs-pres',JSON.stringify(pres))}catch(e){}}
function isLive(uid){if(uid===me.uid)return true;var p=pres[uid];return!!(p&&p.on&&Date.now()-p.ts<60000)}
function lastSeen(uid){var p=pres[uid];return p&&p.ts?ago(p.ts):null}
function probePresence(pid){return new Promise(function(res){
  if(!peer||peer.destroyed)return res(false);
  var done=false;
  try{
    var p=peer.connect(pid,{metadata:{ping:true},reliable:false});
    var t=setTimeout(function(){if(!done){done=true;try{p.close()}catch(e){}res(false)}},4000);
    p.on('open',function(){if(!done){done=true;clearTimeout(t);try{p.close()}catch(e){}res(true)}});
    p.on('error',function(){if(!done){done=true;clearTimeout(t);try{p.close()}catch(e){}res(false)}});
  }catch(e){res(false)}
})}
function knownPeers(){var s={};friends.forEach(function(_,u){s[u]=1});getRecents().forEach(function(u){if(u!==me.uid)s[u]=1});return Object.keys(s)}
var probingAll=false;
async function probeAll(){
  if(probingAll||document.hidden||!peer||peer.destroyed)return;probingAll=true;
  var ids=knownPeers();
  for(var i=0;i<ids.length;i++){var on=await probePresence(ids[i]);pres[ids[i]]={on:on,ts:on?Date.now():(pres[ids[i]]||{}).ts||0,seen:(pres[ids[i]]||{}).seen};if(on)pres[ids[i]].seen=Date.now()}
  savePres();probingAll=false;renderCurrent();
}
setInterval(probeAll,30000);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(peer&&peer.disconnected){try{peer.reconnect()}catch(e){}}
  probeAll();
});
window.addEventListener('online',function(){if(peer&&peer.disconnected){try{peer.reconnect()}catch(e){}}setHdr('on')});
window.addEventListener('offline',function(){setHdr('er')});

/* ============ gun (best-effort discovery only — pipe is primary) ============ */
var gun,users,meNode;
function initGun(){
  try{
    gun=Gun({peers:['https://gun-manhattan.herokuapp.com/gun','https://peer.wallie.io/gun']});
    users=gun.get('ghoststream').get('users');
    meNode=users.get(me.uid);
    meNode.get('name').put(me.name||'Anonymous');
    meNode.get('videos').map().on(function(v,vid){if(v&&v.title!=null&&!videos.has(vid))upsertVideo(vid,v,me.uid)});
    meNode.get('friends').map().on(function(v,uid){if(v&&v.since)addFriend(uid)});
    var rec=getRecents();
    for(var i=0;i<rec.length;i++){(function(uid){users.get(uid).get('videos').map().on(function(v,vid){if(v&&v.title!=null)upsertVideo(vid,v,uid)});users.get(uid).get('name').on(function(n){if(n){savePeerName(uid,n);renderCurrent()}})})(rec[i])}
  }catch(e){}
}
function gunPublish(vid,man){try{meNode.get('videos').get(vid).put(man)}catch(e){}}
function gunFriend(uid){try{meNode.get('friends').get(uid).put({since:Date.now()});users.get(uid).get('friends').get(me.uid).put({since:Date.now()})}catch(e){}}

async function pairWith(uid,skipNav){

/* ============ pipe sync: manifests + notifications travel the connection ============ */
function sendSync(c){try{c.send(JSON.stringify({t:'sync',uid:me.uid,name:me.name,vids:myManifestList()}))}catch(e){}}
function mergeSync(m){
  var n=m.uid||'';
  if(m.name){profiles_set(n,m.name)}
  var added=0;
  (m.vids||[]).forEach(function(e){var vid=e.id,man=e.man;if(!vid||!man||!man.title)return;man.owner=n;if(!videos.has(vid)){added++;upsertVideo(vid,man,n)}});
  if(added){playPing();toast((m.name||n.slice(2,8).toUpperCase())+' shared '+added+' video'+(added>1?'s':''))}
  renderCurrent();
}

function profiles_set(uid,name){if(!uid||!name)return;profilesMap[uid]=name;savePeerName(uid,name)}
function displayName(uid){if(uid===me.uid)return me.name||'You';return profilesMap[uid]||uid.slice(2,8).toUpperCase()}

/* ============ wire connection ============ */
function wireConn(conn){
  conn.on('open',function(){
    conns.set(conn.peer,conn);
    addRecent(conn.peer);
    pres[conn.peer]={on:true,ts:Date.now(),seen:Date.now()};savePres();
    try{conn.send(JSON.stringify({t:'hi',uid:me.uid,name:me.name}))}catch(e){}
    sendSync(conn);
    renderCurrent();
  });
  conn.on('data',function(d){
    if(d instanceof ArrayBuffer||ArrayBuffer.isView(d)){onHostBytes(d);return}
    var m;try{m=JSON.parse(d)}catch(e){return}
    if(m.t==='hi'||m.t==='sync'){
      if(m.name)profiles_set(m.uid||conn.peer,m.name);
      if(m.t==='sync')mergeSync(m);
      if(m.t==='hi'){toast(displayName(m.uid||conn.peer)+' is connected');sendSync(conn)}
      pres[conn.peer]={on:true,ts:Date.now(),seen:Date.now()};savePres();renderCurrent();
    }
    else if(m.t==='newvid'){if(m.vid&&m.man&&m.man.title){var isNew=!videos.has(m.vid);m.man.owner=m.from||conn.peer;upsertVideo(m.vid,m.man,m.from||conn.peer);if(isNew){playPing();toast(displayName(conn.peer)+' uploaded: '+m.man.title)}}}
    else if(m.t==='want')hostWant(conn,m);
    else if(m.t==='pull')hostPull(conn,m);
    else if(m.t==='size')onWantSize(m);
    else if(m.t==='nofile')onWantNoFile();
    else if(m.t==='chunk')onChunkMeta(m);
    else if(m.t==='chunkerr')onChunkErr(m);
  });
  conn.on('close',function(){if(conns.get(conn.peer)===conn)conns.delete(conn.peer);pres[conn.peer]={on:false,ts:pres[conn.peer]?pres[conn.peer].ts:0,seen:pres[conn.peer]?pres[conn.peer].seen:0};savePres();renderCurrent()});
  conn.on('error',function(){});
}

/* ============ host: serve file ranges ============ */
var serving=new Map();
async function getServingFile(vid){
  if(serving.has(vid)){var f=serving.get(vid);return(f&&f.size)?f:null}
  var rec=await idb.get(vid);
  if(rec&&rec.h){
    try{
      if(await rec.h.queryPermission({mode:'read'})==='granted'){var f2=await rec.h.getFile();if(f2&&f2.size){serving.set(vid,f2);return f2}}
    }catch(e){}
  }
  return null;
}
var hostBusy=Promise.resolve();
function hostWant(conn,m){
  getServingFile(m.vid).then(function(f){
    if(f)try{conn.send(JSON.stringify({t:'size',vid:m.vid,n:f.size}))}catch(e){}
    else try{conn.send(JSON.stringify({t:'nofile',vid:m.vid}))}catch(e){}
    if(f)reqWake();
  });
}
function hostPull(conn,m){
  hostBusy=hostBusy.then(async function(){
    try{
      var f=await getServingFile(m.vid);
      if(!f){try{conn.send(JSON.stringify({t:'chunkerr',id:m.id}))}catch(e){}return}
      var end=Math.min(m.end,f.size-1);
      var buf=await f.slice(m.start,end+1).arrayBuffer();
      var P=131072;
      try{conn.send(JSON.stringify({t:'chunk',id:m.id,len:buf.byteLength}))}catch(e){return}
      for(var o=0;o<buf.byteLength;o+=P){
        if(!conn.open)return;
        conn.send(buf.slice(o,Math.min(o+P,buf.byteLength)));
        await sleep(0);
      }
    }catch(e){try{conn.send(JSON.stringify({t:'chunkerr',id:m.id}))}catch(x){}}
  });
}
async function enableServing(){
  var mine=[];videos.forEach(function(v,vid){if(v.owner===me.uid)mine.push(vid)});
  var ok=0;
  for(var i=0;i<mine.length;i++){
    var vid=mine[i];
    if(serving.has(vid)){ok++;continue}
    if(window.showOpenFilePicker){
      try{
        var rec=await idb.get(vid);
        if(rec&&rec.h){var q=await rec.h.queryPermission({mode:'read'});if(q!=='granted')q=await rec.h.requestPermission({mode:'read'});if(q==='granted'){serving.set(vid,await rec.h.getFile());ok++;continue}}
      }catch(e){}
    }
  }
  if(ok===mine.length&&ok>0){toast('Serving ready — '+ok+' video'+(ok>1?'s':''));renderCurrent();return}
  toast('Re-select your videos to serve them');
  $('#fpick').dataset.mode='serve';
  $('#fpick').multiple=true;
  $('#fpick').click();
}
async function delVideo(vid){
  if(!confirm('Remove this video from your channel?'))return;
  try{meNode.get('videos').get(vid).put(null)}catch(e){}
  await idb.del(vid);removeVideo(vid);
  broadcast({t:'delvid',vid:vid});
  toast('Removed');
}
function broadcast(msg){conns.forEach(function(c){if(c.open)try{c.send(JSON.stringify(msg))}catch(e){}})}

/* ============ viewer: direct chunk transfer (directdrop style) ============ */
var activeRx=null,wseq=0,watchCtx=null,watchAbort=false,xferTotal=0,xferStart=0;
function onWantSize(m){if(activeRx&&activeRx.wantRes){var r=activeRx.wantRes;activeRx.wantRes=null;clearTimeout(activeRx.wantT);r(m.n)}}
function onWantNoFile(){if(activeRx&&activeRx.wantRes){var r=activeRx.wantRes;activeRx.wantRes=null;clearTimeout(activeRx.wantT);r(-1)}}
function pullSize(conn,vid){return new Promise(function(res){
  activeRx={wantRes:res,wantT:setTimeout(function(){activeRx&&(activeRx.wantRes=null);res(-1)},10000)};
  try{conn.send(JSON.stringify({t:'want',vid:vid}))}catch(e){res(-1)}
})}
function pullWindow(conn,vid,start,end){return new Promise(function(res){
  var id='w'+(++wseq);
  var p={id:id,len:0,got:0,parts:[],res:res,t:setTimeout(function(){if(activeRx===p){activeRx=null}res(null)},30000)};
  activeRx=p;
  try{conn.send(JSON.stringify({t:'pull',id:id,vid:vid,start:start,end:end}))}catch(e){res(null)}
})}
function onChunkMeta(m){if(activeRx&&activeRx.id===m.id){activeRx.len=m.len;activeRx.got=0;activeRx.parts=[]}}
function onChunkErr(m){if(activeRx&&activeRx.id===m.id){clearTimeout(activeRx.t);var r=activeRx.res;activeRx=null;r(null)}}
function onHostBytes(buf){
  if(!activeRx||!activeRx.len)return;
  var b=buf instanceof ArrayBuffer?buf:buf.buffer.slice(buf.byteOffset,buf.byteOffset+buf.byteLength);
  activeRx.parts.push(b);activeRx.got+=b.byteLength;xferTotal+=b.byteLength;
  updateXfer();
  if(activeRx.got>=activeRx.len){clearTimeout(activeRx.t);var p=activeRx;activeRx=null;
    var u=new Uint8Array(p.len),o=0;for(var i=0;i<p.parts.length;i++){u.set(new Uint8Array(p.parts[i]),o);o+=p.parts[i].byteLength}
    p.res(u.buffer);
  }
}
function setStatus(t){var el=$('#wstate');if(el)el.textContent=t||''}
function updateXfer(){
  var el=$('#xfer');if(!el)return;
  var dt=(Date.now()-xferStart)/1000||1;
  var speed=xferTotal/dt;
  el.textContent=fmtB(xferTotal)+' transferred · '+fmtB(speed)+'/s · direct peer link';
  var bar=$('#pfill');if(bar&&watchCtx&&watchCtx.size)bar.style.width=Math.min(100,(xferTotal/watchCtx.size)*100)+'%';
}
async function startWatch(uid,vid){
  var man=videos.get(vid);
  var v=$('#vid');if(!v)return;
  if(!man){setStatus('Video not found');return}
  watchCtx={uid:uid,vid:vid,man:man,size:man.size};watchAbort=false;xferTotal=0;
  reqWake();
  /* SELF: play instantly from the local file — no network, no shims */
  if(uid===me.uid){
    var f=await getServingFile(vid);
    if(f){
      v.src=URL.createObjectURL(f);v.play().catch(function(){});
      setStatus('Playing from your device');relWake();return;
    }
    var gp=$('#wgrant');
    if(gp){gp.classList.remove('hidden');setStatus('')}
    return;
  }
  /* REMOTE: probe first (honest 4s), then pull chunks over the pipe */
  setStatus('Probing '+displayName(uid)+'\u2026');
  var online=await probePresence(uid);
  if(watchAbort)return;
  pres[uid]={on:online,ts:Date.now(),seen:online?Date.now():(pres[uid]||{}).seen};savePres();renderCurrent();
  if(!online){
    $('#woff').classList.remove('hidden');
    document.querySelector('.vwrap').style.opacity=.35;
    setStatus('');relWake();return;
  }
  setStatus('Connecting\u2026');
  var conn;
  try{conn=await getConn(uid)}catch(e){
    $('#woff').classList.remove('hidden');
    document.querySelector('.vwrap').style.opacity=.35;
    setStatus('');relWake();return;
  }
  if(watchAbort)return;
  setStatus('Requesting video\u2026');
  var size=await pullSize(conn,vid);
  if(watchAbort)return;
  if(size<0){
    setStatus('Not available — '+displayName(uid)+' needs to reopen GhostStream and re-enable serving');
    $('#woff').classList.remove('hidden');
    relWake();return;
  }
  watchCtx.size=size;
  xferStart=Date.now();
  var W=2097152,parts=[];
  for(var o=0;o<size;o+=W){
    if(watchAbort)return;
    setStatus('Downloading '+Math.min(100,Math.round((o/size)*100))+'%');
    var buf=await pullWindow(conn,vid,o,Math.min(o+W,size)-1);
    if(watchAbort)return;
    if(!buf){setStatus('Transfer interrupted');relWake();return}
    parts.push(buf);updateXfer();
  }
  setStatus('Ready');
  var blob=new Blob(parts,{type:man.mime||'video/mp4'});
  v.src=URL.createObjectURL(blob);
  v.play().catch(function(){});
  relWake();
}
function grantSelf(vid){
  (async function(){
    var rec=await idb.get(vid);
    if(rec&&rec.h&&window.showOpenFilePicker!==undefined){
      try{
        var q=await rec.h.requestPermission({mode:'read'});
        if(q==='granted'){var f=await rec.h.getFile();serving.set(vid,f);var v=$('#vid');if(v){v.src=URL.createObjectURL(f);v.play()}$('#wgrant').classList.add('hidden');return}
      }catch(e){}
    }
    $('#fpick').dataset.mode='relink';$('#fpick').dataset.vid=vid;$('#fpick').multiple=false;$('#fpick').click();
  })();
}
function leaveWatch(){watchAbort=true;watchCtx=null;xferTotal=0;relWake()}
function notifyOwner(){
  var w=watchCtx;if(!w)return;
  broadcastTo(w.uid,{t:'wantnotify',from:me.uid,vid:w.vid,name:me.name});
  try{users.get(w.uid).get('requests').get(me.uid+'_'+w.vid).put({from:me.uid,vid:w.vid,at:Date.now()})}catch(e){}
  toast('Request sent');

function broadcastTo(uid,msg){var c=conns.get(uid);if(c&&c.open)try{c.send(JSON.stringify(msg))}catch(e){}}

function handlePicked(file,handle){pub={file:file,handle:handle};renderCurrent()}
function grabThumb(file){return new Promise(function(res){
  var v=document.createElement('video');v.muted=true;v.preload='metadata';
  var url=URL.createObjectURL(file);v.src=url;var settled=false;
  function done(o){if(settled)return;settled=true;URL.revokeObjectURL(url);res(o)}
  v.onloadedmetadata=function(){try{v.currentTime=Math.min(1,(v.duration||2)*.25)}catch(e){done({thumb:'',duration:v.duration||0})}};
  v.onseeked=function(){try{var w=320,h=Math.max(1,Math.round(w*(v.videoHeight/v.videoWidth)));var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);done({thumb:c.toDataURL('image/jpeg',.62),duration:v.duration||0})}catch(e){done({thumb:'',duration:v.duration||0})}};
  v.onerror=function(){done({thumb:'',duration:0})};
  setTimeout(function(){done({thumb:'',duration:0})},8000);
})}
async function doPublish(){
  if(!pub.file)return;
  var title=($('#ptitle')?$('#ptitle').value.trim():'')||'Untitled';
  var st=$('#pubstate');if(st)st.textContent='Preparing thumbnail\u2026';
  var th=await grabThumb(pub.file);
  var vid='v'+rid(9);
  var man={title:title,size:pub.file.size,mime:pub.file.type||'video/mp4',dur:Math.round(th.duration||0),thumb:th.thumb,postedAt:Date.now()};
  upsertVideo(vid,man,me.uid);
  gunPublish(vid,man);
  if(pub.handle)await idb.put(vid,{h:pub.handle});
  serving.set(vid,pub.file);
  broadcast({t:'newvid',vid:vid,man:man,from:me.uid});
  pub={file:null,handle:null};
  playPing();
  toast('Published — pushed to connected peers');
  location.hash='#/you';
}

/* ============ qr + scanner (directdrop pattern) ============ */
function drawQR(el,text){
  try{
    var qr=qrcode(0,'M');qr.addData(text);qr.make();
    var count=qr.getModuleCount(),cell=4,m=8;
    var cv=document.createElement('canvas');cv.width=count*cell+m*2;cv.height=count*cell+m*2;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#f1f1f1';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#0f0f0f';
    for(var r=0;r<count;r++)for(var c=0;c<count;c++)if(qr.isDark(r,c))ctx.fillRect(c*cell+m,r*cell+m,cell,cell);
    el.innerHTML='';el.appendChild(cv);
  }catch(e){el.textContent=text}
}

async function startScan(){

/* ============ views ============ */
function empty(icon,title,sub){return '<div class="empty"><svg class="i big"><use href="#'+icon+'"/></svg><b>'+esc(title)+'</b><p>'+esc(sub)+'</p></div>'}
function cardHTML(vid,v,own){
  var live=isLive(v.owner),name=displayName(v.owner);
  var th=v.thumb?'<img loading="lazy" src="'+v.thumb+'">':'<div class="th-ph"><svg class="i"><use href="#i-film"/></svg></div>';

  return '<article class="card" data-act="watch" data-uid="'+v.owner+'" data-vid="'+vid+'">'+
    '<div class="thumb">'+th+x+

/* ============ router ============ */
function router(){
  if(!me.uid){viewOnboard();return}
  document.body.classList.remove('pre');
  var onb=document.querySelector('.onb');if(onb)onb.remove();
  var parts=location.hash.replace(/^#\/?/,'').split('/');
  closeSheet();leaveWatch();
  var fn;
  if(parts[0]==='add'&&parts[1]){pairWith(decodeURIComponent(parts[1]));history.replaceState(null,'','#/home');fn=viewHome}
  else if(parts[0]==='watch'&&parts[1]&&parts[2])fn=function(){viewWatch(parts[1],parts[2])};
  else if(parts[0]==='channel'&&parts[1])fn=function(){viewChannel(parts[1])};
  else if(parts[0]==='publish')fn=viewPublish;
  else if(parts[0]==='subs')fn=viewSubs;
  else if(parts[0]==='activity')fn=viewActivity;
  else if(parts[0]==='you')fn=viewYou;
  else fn=viewHome;
  setNav(parts[0]||'home');
  viewFn=fn;fn();
}
window.addEventListener('hashchange',router);

/* ============ actions ============ */
document.addEventListener('click',function(e){
  var r=e.target.closest('#nav [data-r]');
  if(r){location.hash='#/'+r.dataset.r;return}
  var a=e.target.closest('[data-act]');
  if(!a)return;

  if(act==='watch')location.hash='#/watch/'+a.dataset.uid+'/'+a.dataset.vid;
  else if(act==='chan')location.hash='#/channel/'+a.dataset.uid;
  else if(act==='pick')pickVideo();
  else if(act==='publish')doPublish();
  else if(act==='onboard')onboardSubmit();
  else if(act==='show-qr')openSheet('qr');
  else if(act==='scan')startScan();
  else if(act==='scan-close')stopScan();
  else if(act==='do-pair')pairWith($('#pairInput')?$('#pairInput').value:'');
  else if(act==='copy-uid')navigator.clipboard.writeText(me.uid).then(function(){toast('Code copied')});
  else if(act==='copy-invite')navigator.clipboard.writeText(location.origin+'/#/add/'+me.uid).then(function(){toast('Invite link copied')});
  else if(act==='share-invite')shareInvite();
  else if(act==='copy-watch')navigator.clipboard.writeText(location.origin+'/#/watch/'+a.dataset.uid+'/'+a.dataset.vid).then(function(){toast('Link copied')});
  else if(act==='enable-serve')enableServing();
  else if(act==='grant')grantSelf(a.dataset.vid);
  else if(act==='del')delVideo(a.dataset.vid);
  else if(act==='notify'){watchCtx={uid:a.dataset.uid,vid:a.dataset.vid};notifyOwner()}
  else if(act==='close-sheet')closeSheet();
  else if(act==='rename'){var n=prompt('Display name',me.name||'');if(n&&n.trim()){me.name=n.trim();saveMe();try{meNode.get('name').put(me.name)}catch(e){}renderCurrent()}}
});
document.addEventListener('keydown',function(e){

});
 $('#fpick').addEventListener('change',function(e){
  var mode=this.dataset.mode||'publish';
  var vids=this.dataset.vid;
  this.dataset.mode='';delete this.dataset.vid;
  var files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  if(mode==='serve'){
    var done=0;
    files.forEach(function(f){
      var match=null;videos.forEach(function(v,vid){if(v.owner===me.uid&&!serving.has(vid)&&!match&&Math.abs(v.size-f.size)<2)match=vid});
      if(match){serving.set(match,f);done++}
    });
    toast(done?('Serving re-enabled — '+done+' video'+(done>1?'s':'')):'Could not match files');
    renderCurrent();return;
  }
  if(mode==='relink'&&vids){serving.set(vids,files[0]);grantSelfAfter(vids);return}
  handlePicked(files[0],null);
});
function grantSelfAfter(vid){var f=serving.get(vid);var v=$('#vid');if(f&&v){v.src=URL.createObjectURL(f);v.play();var g=$('#wgrant');if(g)g.classList.add('hidden')}}
async function onboardSubmit(){
  var n=($('#oname')?$('#oname').value.trim():'');
  if(!n)return toast('Enter a name');
  var b=document.querySelector('[data-act="onboard"]');

/* incoming wantnotify -> activity + toast */
function onWantNotify(m){
  try{
    var reqs=JSON.parse(localStorage.getItem('gs-inreq')||'[]');
    reqs.push({from:m.from,vid:m.vid,at:Date.now()});
    localStorage.setItem('gs-inreq',JSON.stringify(reqs.slice(-30)));
  }catch(e){}
  playPing();
  toast((m.name||'Someone')+' requested a video');
}

/* patch wireConn data handler to include wantnotify */
var _origWire=wireConn;

/* ============ boot ============ */
(async function boot(){
  await idb.open();
  loadMe();
  loadFeed();
  /* rehydrate serving for this session */
  videos.forEach(function(v,vid){
    if(v.owner===me.uid){
      idb.get(vid).then(function(rec){
        if(rec&&rec.h&&rec.h.queryPermission)rec.h.queryPermission({mode:'read'}).then(function(q){if(q==='granted')rec.h.getFile().then(function(f){if(f&&f.size)serving.set(vid,f)})}).catch(function(){});
      });
    }
  });
  if(me.uid){
    await bootPeer();
    initGun();
    /* hook wantnotify into live connections */
    var origConnect=peer.connect.bind(peer);
    router();
    setTimeout(probeAll,2500);
    document.addEventListener('gs-wantnotify',function(){});
    /* route wantnotify messages: extend handler via wrapper */
    var oldWire=wireConn;
  }else{
    viewOnboard();
  }
})();
/* wantnotify routing — appended message branch */
document.addEventListener('click',function(){},true);
(function(){
  var origHandler=null;
  window.addEventListener('message',function(){});
})();
</script>
<script>
/* final patch: extend data handler for wantnotify without rewriting wireConn */
(function(){
  var send=DataChannel=null;
})();
wireConn=function(conn){
  conn.on('open',function(){
    conns.set(conn.peer,conn);
    addRecent(conn.peer);
    pres[conn.peer]={on:true,ts:Date.now(),seen:Date.now()};savePres();
    try{conn.send(JSON.stringify({t:'hi',uid:me.uid,name:me.name}))}catch(e){}
    sendSync(conn);
    renderCurrent();
  });
  conn.on('data',function(d){
    if(d instanceof ArrayBuffer||ArrayBuffer.isView(d)){onHostBytes(d);return}
    var m;try{m=JSON.parse(d)}catch(e){return}
    if(m.t==='wantnotify'){onWantNotify(m);return}
    if(m.t==='delvid'){removeVideo(m.vid);return}
    if(m.t==='hi'||m.t==='sync'){
      if(m.name)profiles_set(m.uid||conn.peer,m.name);
      if(m.t==='sync')mergeSync(m);
      if(m.t==='hi'){toast(displayName(m.uid||conn.peer)+' connected');sendSync(conn)}
      pres[conn.peer]={on:true,ts:Date.now(),seen:Date.now()};savePres();renderCurrent();
    }
    else if(m.t==='newvid'){if(m.vid&&m.man&&m.man.title){var isNew=!videos.has(m.vid);m.man.owner=m.from||conn.peer;upsertVideo(m.vid,m.man,m.from||conn.peer);if(isNew){playPing();toast(displayName(conn.peer)+' uploaded: '+m.man.title)}}}
    else if(m.t==='want')hostWant(conn,m);
    else if(m.t==='pull')hostPull(conn,m);
    else if(m.t==='size')onWantSize(m);
    else if(m.t==='nofile')onWantNoFile();
    else if(m.t==='chunk')onChunkMeta(m);
    else if(m.t==='chunkerr')onChunkErr(m);
  });
  conn.on('close',function(){if(conns.get(conn.peer)===conn)conns.delete(conn.peer);pres[conn.peer]={on:false,ts:pres[conn.peer]?pres[conn.peer].ts:0,seen:pres[conn.peer]?pres[conn.peer].seen:0};savePres();renderCurrent()});
  conn.on('error',function(){});
};
</script>
